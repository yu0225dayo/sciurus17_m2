services:
  sciurus17:
    build: .
    image: sciurus17_ros2:jazzy
    container_name: sciurus17_ros2
    environment:
      # ホスト環境から DISPLAY を引き継ぐ (native Linux / WSLg 両対応)
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1000
      - ROS_DOMAIN_ID=0
      - QT_X11_NO_MITSHM=1
      - LANG=ja_JP.UTF-8
      - PYTHONIOENCODING=utf-8
    volumes:
      # ROS2 ワークスペース
      - ./ws:/ros2_ws
      # プロジェクト全体 (ros/, client/ へのアクセス用)
      - ..:/sciurus17_m2
      # X11 ソケット (GUI表示用) — 事前に xhost +local: を実行すること
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
    stdin_open: true
    tty: true

  # 実機接続用
  sciurus17_real:
    extends:
      service: sciurus17
    container_name: sciurus17_ros2_real
    devices:
      # symlink は Docker で解決されないため ttyUSB0 を直接 sciurus17spine にマッピング
      - /dev/sciurus17spine:/dev/sciurus17spine
      - /dev/bus/usb:/dev/bus/usb
      # RealSense UVC 制御に /dev/video* が必要
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
    privileged: true
